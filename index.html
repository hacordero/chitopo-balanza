<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balanza 10C · Chitopo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
body{margin:0;background:#0b1220;color:#e8eefc;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
form{width:min(360px,100%);display:grid;gap:12px;background:#111a2e;border:1px solid #2a3654;border-radius:14px;padding:24px}
h1{margin:0;font-size:22px}p{margin:0;color:#9fb0d6;font-size:14px}
input{font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid #2a3654;background:#0b1220;color:#e8eefc}
button{font-size:16px;padding:11px;border-radius:10px;border:0;background:#1f6feb;color:#fff;font-weight:600;cursor:pointer}
#msg{min-height:1.2em;font-size:14px;color:#9fb0d6}#msg.err{color:#ff7b72}
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Balanza 10 cabezales · Chitopo</h1>
  <p>Ingresá con tu correo y contraseña para ver la producción en vivo.</p>
  <input id="em" type="email" placeholder="correo" autocomplete="username" required>
  <input id="pw" type="password" placeholder="contraseña" autocomplete="current-password" required>
  <button>Entrar</button>
</form>
<div id="msg">Cargando…</div>
<script>
{
const SB_URL = "https://ewxwphglvkgflspddahf.supabase.co", SB_KEY = "sb_publishable_Ed4vH1Kq5njMyk9A_OYUPg_Yt_ltDV1", EQ = "balanza10c-chitopo";
const sb = supabase.createClient(SB_URL, SB_KEY);
const msg = (t, err) => { const m = document.getElementById("msg"); m.textContent = t; m.className = err ? "err" : ""; };

// Lo que se agrega a la página local para que lea de la nube en vez de la placa B
const SHIM = `<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>
<script>
(function(){
  const sb = supabase.createClient("${SB_URL}","${SB_KEY}"), EQ="${EQ}";
  let api=null, hist=[], tApi=0, tHist=0, enCurso=false;
  async function traerApi(){
    if (enCurso) return; enCurso=true;
    try{ const {data}=await sb.from("estado_actual").select("ts,api").eq("equipo",EQ).maybeSingle();
      if (data && data.api){ const edad=(Date.now()-new Date(data.ts))/1000, d=data.api;
        d.edad_s = edad>120 ? null : 0;
        d.fuente = edad>120 ? "La placa B no envía datos a la nube hace "+Math.round(edad/60)+" min" : "Nube · dato de hace "+Math.round(edad)+" s";
        api=d; }
    }catch(e){} tApi=Date.now(); enCurso=false;
  }
  async function traerHist(){ try{ const {data}=await sb.from("estado_actual").select("hist").eq("equipo",EQ).maybeSingle(); if (data && data.hist) hist=data.hist; }catch(e){} tHist=Date.now(); }
  const fo=window.fetch.bind(window);
  const J=v=>new Response(JSON.stringify(v),{headers:{"Content-Type":"application/json"}});
  window.fetch=async function(u,o){
    const url=typeof u==="string"?u:(u&&u.url)||"";
    if (url.startsWith("/api")){ if(!document.hidden && Date.now()-tApi>15000) traerApi(); return J(api); }
    if (url.startsWith("/hist")){ if(Date.now()-tHist>60000 || !hist.length) await traerHist(); return J(hist); }
    if (url.startsWith("/sku")) return J({ok:false});
    return fo(u,o);
  };
  traerApi(); traerHist();
  document.addEventListener("DOMContentLoaded",()=>{
    const b=document.getElementById("nubeSalir"); if(b) b.onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
    sb.auth.getSession().then(({data})=>{ const u=document.getElementById("nubeUser"); if(u&&data.session) u.textContent=data.session.user.email; });
  });
})();
<\/script>
<style>#nubeBar{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:12px;opacity:.8;padding:4px 16px}
#nubeBar button{font-size:12px;background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:2px 8px;cursor:pointer}
#selSkuReal{display:none!important}</style>`;
const BAR = `<div id="nubeBar"><span>Versión nube · <span id="nubeUser"></span></span><button id="nubeSalir" type="button">Salir</button></div>`;

async function abrirDashboard(){
  msg("Cargando el dashboard…");
  const { data, error } = await sb.from("paginas").select("fw,idx_gz_b64").eq("equipo", EQ).maybeSingle();
  if (error || !data || !data.idx_gz_b64) { msg("Todavía no está la página del dashboard en la nube (la placa B la sube al arrancar).", true); return; }
  const bytes = Uint8Array.from(atob(data.idx_gz_b64), c => c.charCodeAt(0));
  let html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  html = html.replace('<script src="/lib/chart.umd.min.js"><\/script>', '<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"><\/script>')
             .replace('"/lib/xlsx.full.min.js"', '"https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"')
             .replace('const MODO_REAL = location.protocol==="http:";', 'const MODO_REAL = true;')
             .replace('</head>', SHIM + '</head>')
             .replace('<body>', '<body>' + BAR);
  document.open(); document.write(html); document.close();
}

async function inicio(){
  const { data } = await sb.auth.getSession();
  if (data.session) return abrirDashboard();
  msg(""); document.getElementById("f").hidden = false;
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault(); msg("Entrando…");
  const { error } = await sb.auth.signInWithPassword({ email: document.getElementById("em").value.trim(), password: document.getElementById("pw").value });
  if (error) return msg("No pude entrar: revisá correo y contraseña.", true);
  document.getElementById("f").hidden = true; abrirDashboard();
});
inicio();
}
</script>
</body>
</html>
